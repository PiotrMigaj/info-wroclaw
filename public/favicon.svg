<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <!-- Newspaper sheet -->
  <rect x="7" y="6" width="18" height="20" rx="2" fill="white"/>
  <!-- Header bar -->
  <rect x="7" y="6" width="18" height="6" rx="2" fill="#1d4ed8"/>
  <rect x="7" y="10" width="18" height="2" fill="#1d4ed8"/>
  <!-- "W" letter in header -->
  <text x="16" y="13.5" font-family="Georgia,serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">W</text>
  <!-- Text lines -->
  <rect x="9" y="15" width="14" height="1.5" rx="0.75" fill="#93c5fd"/>
  <rect x="9" y="18" width="11" height="1.5" rx="0.75" fill="#bfdbfe"/>
  <rect x="9" y="21" width="14" height="1.5" rx="0.75" fill="#bfdbfe"/>
  <rect x="9" y="24" width="9"  height="1.5" rx="0.75" fill="#bfdbfe"/>
</svg>
